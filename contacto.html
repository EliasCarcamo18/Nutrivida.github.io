<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto - NutriVida</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>NutriVida</h1>
        <nav><a href="index.html">Inicio</a></nav>
    </header>

    <main>
        <h2>Contacto y Ubicacion</h2>
        <form class="formulario">
            <div class="grupo-form">
                <label>Nombre:</label>
                <input type="text" required>
            </div>
            <div class="grupo-form">
                <label>Correo Electronico:</label>
                <input type="email" required>
            </div>
            <div class="grupo-form">
                <label>Mensaje:</label>
                <textarea rows="4" required></textarea>
            </div>
            <button type="submit" class="btn">Enviar Consulta</button>
        </form>

        <section style="margin-top: 20px;">
            <h3>Ubicacion Clinica Temuco</h3>
            <p>Direccion: Av. Alemania 0123, Temuco</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 NutriVida</p>
    </footer>
</body>
</html>
